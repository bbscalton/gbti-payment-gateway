name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Wrangler 4.x requires Node 22+
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          packageManager: npm
          # Use the repo-pinned Wrangler 4.x from package.json (not the action's Wrangler 3 fallback)
          command: deploy
          # Secrets WEBHOOK_SECRET / FIREBASE_* should already exist on the Worker
          # (set once via `wrangler secret put`). Re-deploy does not wipe them.
